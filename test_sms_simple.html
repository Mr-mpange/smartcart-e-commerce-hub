<!DOCTYPE html>
<html>
<head>
    <title>SMS Test - SmartCart</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>SMS Test - SmartCart</h1>
    <p>Testing SMS to admin phone: <strong>+255683859574</strong></p>
    
    <button onclick="testSMS()">Send Test SMS</button>
    <button onclick="testOTP()">Test OTP Generation</button>
    
    <div id="result"></div>

    <script>
        const SUPABASE_URL = 'https://kdiegxbfuohrbktonkmh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkaWVneGJmdW9ocmJrdG9ua21oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyOTIzMTYsImV4cCI6MjA3OTg2ODMxNn0.EyJWQtTjnTgW4uJcCqFasEn49vT1x0mSsxEz1H4CT1o';
        
        async function testSMS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Sending SMS...';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/briq-sms`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    },
                    body: JSON.stringify({
                        phone_number: '+255683859574',
                        message: 'Test SMS from SmartCart - API Key Updated!'
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ SMS SENT SUCCESSFULLY!\n\nResponse: ${JSON.stringify(result, null, 2)}\n\nCheck your phone (+255683859574) for the SMS!`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ SMS FAILED\n\nError: ${result.error}\n\nFull Response: ${JSON.stringify(result, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ NETWORK ERROR\n\nError: ${error.message}`;
            }
        }
        
        async function testOTP() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Generating OTP...';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/briq-sms`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    },
                    body: JSON.stringify({
                        action: 'generate_otp',
                        email: 'admin@test.com'
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ OTP GENERATED SUCCESSFULLY!\n\nResponse: ${JSON.stringify(result, null, 2)}\n\nCheck your phone (+255683859574) for the OTP SMS!`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ OTP GENERATION FAILED\n\nError: ${result.error}\n\nFull Response: ${JSON.stringify(result, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ NETWORK ERROR\n\nError: ${error.message}`;
            }
        }
    </script>
</body>
</html>
