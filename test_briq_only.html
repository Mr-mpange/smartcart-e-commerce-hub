<!DOCTYPE html>
<html>
<head>
    <title>Test Briq SMS Only</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; white-space: pre-wrap; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Briq SMS Function Only</h1>
    <p>Testing just the briq-sms Edge Function</p>
    <p>Phone: <strong>+255683859574</strong></p>
    
    <button onclick="testBriqSMS()">Test Briq SMS Function</button>
    
    <div id="result"></div>

    <script>
        const SUPABASE_URL = 'https://kdiegxbfuohrbktonkmh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkaWVneGJmdW9ocmJrdG9ua21oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyOTIzMTYsImV4cCI6MjA3OTg2ODMxNn0.EyJWQtTjnTgW4uJcCqFasEn49vT1x0mSsxEz1H4CT1o';
        
        async function testBriqSMS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing briq-sms function...';
            
            try {
                console.log('Making request to:', `${SUPABASE_URL}/functions/v1/briq-sms`);
                
                const response = await fetch(`${SUPABASE_URL}/functions/v1/briq-sms`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    },
                    body: JSON.stringify({
                        phone_number: '+255683859574',
                        message: 'Direct test of briq-sms function - API key check'
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));
                
                const responseText = await response.text();
                console.log('Raw response:', responseText);
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ INVALID JSON RESPONSE\n\nStatus: ${response.status}\nRaw Response: ${responseText}\n\nThis suggests the Edge Function is not deployed properly or returning HTML instead of JSON.`;
                    return;
                }
                
                if (response.ok && result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ BRIQ SMS FUNCTION WORKING!\n\nResponse: ${JSON.stringify(result, null, 2)}\n\nCheck your phone (+255683859574) for the SMS!`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ BRIQ SMS FUNCTION FAILED\n\nStatus: ${response.status}\nError: ${result.error}\nDetails: ${result.details || 'No additional details'}\n\nFull Response: ${JSON.stringify(result, null, 2)}`;
                    
                    // Provide specific troubleshooting
                    if (result.error?.includes('HTML error page')) {
                        resultDiv.innerHTML += '\n\n🔧 ISSUE: Briq API key is invalid or expired\n💡 SOLUTION: Check your Briq API key in Supabase Dashboard';
                    } else if (result.error?.includes('not configured')) {
                        resultDiv.innerHTML += '\n\n🔧 ISSUE: BRIQ_API_KEY not set\n💡 SOLUTION: Set BRIQ_API_KEY in Supabase Edge Functions environment variables';
                    }
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ NETWORK ERROR\n\nError: ${error.message}\n\nThis could indicate:\n- CORS issues\n- Edge Function not deployed\n- Network connectivity problems`;
                console.error('Network error:', error);
            }
        }
    </script>
</body>
</html>
