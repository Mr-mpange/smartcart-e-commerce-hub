<!DOCTYPE html>
<html>
<head>
    <title>Payment Link Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Payment Link Test</h1>
    
    <div class="test">
        <h2>Test 1: Fetch Payment Link from Database</h2>
        <button onclick="testFetchPaymentLink()">Test Fetch</button>
        <div id="test1-result"></div>
    </div>

    <div class="test">
        <h2>Test 2: Check if Payment Page Loads</h2>
        <p>Visit: <a href="https://uzanasi.online/pay/4a727d89-0500-41b0-9cc3-9a7d43dc263f" target="_blank">https://uzanasi.online/pay/4a727d89-0500-41b0-9cc3-9a7d43dc263f</a></p>
        <p>Check browser console for logs</p>
    </div>

    <script>
        async function testFetchPaymentLink() {
            const resultDiv = document.getElementById('test1-result');
            resultDiv.innerHTML = '<p class="info">Testing...</p>';
            
            try {
                const url = 'https://qpojzblbodlphwzfpxbi.supabase.co/rest/v1/payment_links?id=eq.4a727d89-0500-41b0-9cc3-9a7d43dc263f&select=*';
                const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwb2p6Ymxib2RzcGh3emZweGJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTUwODEsImV4cCI6MjA4ODg5MTA4MX0.aPIcSd3-0kcn44OMiVwshassQwA5v0kbUv5Q9kZNAVg';
                
                const response = await fetch(url, {
                    headers: {
                        'apikey': key,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.length > 0) {
                        const link = data[0];
                        resultDiv.innerHTML = `
                            <p class="success">✅ Payment link found!</p>
                            <ul>
                                <li>ID: ${link.id}</li>
                                <li>Amount: ${link.amount} ${link.currency}</li>
                                <li>Status: ${link.status}</li>
                                <li>Reference: ${link.snippe_reference}</li>
                                <li>Created: ${link.created_at}</li>
                            </ul>
                        `;
                    } else {
                        resultDiv.innerHTML = '<p class="error">❌ Payment link not found in database</p>';
                    }
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ HTTP ${response.status}: ${response.statusText}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
